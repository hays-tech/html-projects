<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">

<title>Satzbau</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
/* Layout: one centered work column, prompt on top, answer line, tile tray, button row, progress footer */
:root{
  --bg:#eef1f4; --panel:#ffffff; --fg:#1b2733; --muted:#5d6b78; --line:#cfd6dd;
  --accent:#1f5fa8; --accent-fg:#ffffff; --tile:#ffffff; --tile-edge:#b9c4cf; --good:#1d7a46; --bad:#b3341f; --good-bg:#e3f3ea; --bad-bg:#f9e4df;
  --serif:'Newsreader',Georgia,serif; --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12181e; --panel:#1b242d; --fg:#e6ebf0; --muted:#97a5b2; --line:#33414d;
  --accent:#6aa8ee; --accent-fg:#0d1620; --tile:#26323d; --tile-edge:#44566a; --good:#5cc489; --bad:#f08b78; --good-bg:#17302a; --bad-bg:#3a1f1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181e; --panel:#1b242d; --fg:#e6ebf0; --muted:#97a5b2; --line:#33414d;
  --accent:#6aa8ee; --accent-fg:#0d1620; --tile:#26323d; --tile-edge:#44566a; --good:#5cc489; --bad:#f08b78; --good-bg:#17302a; --bad-bg:#3a1f1b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font:600 1.5rem/1.2 var(--serif);margin:0}
.meta{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.label{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.prompt{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.prompt .en{font:500 1.6rem/1.3 var(--serif);margin:0;text-wrap:balance}
.target{margin-top:10px;font-size:.85rem;color:var(--muted)}
.target b{color:var(--fg);font-weight:600}
#answer{min-height:72px;border-bottom:2px solid var(--fg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 4px;transition:background .15s}
#answer.over{background:color-mix(in srgb,var(--accent) 12%,transparent)}
#answer .ph{color:var(--muted);font-size:.9rem}
#tray{display:flex;flex-wrap:wrap;gap:10px;min-height:60px;padding:6px 0}
.tile{font:500 1.05rem/1.2 var(--serif);background:var(--tile);color:var(--fg);border:1px solid var(--tile-edge);border-bottom-width:3px;border-radius:8px;padding:10px 14px;cursor:grab;user-select:none;touch-action:manipulation}
.tile:hover{border-color:var(--accent)}
.tile:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tile.drag{opacity:.4}
.tile.used{visibility:hidden}
#answer .tile{border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:10px}
button{font:600 .95rem var(--sans);border-radius:8px;border:1px solid var(--tile-edge);background:var(--panel);color:var(--fg);padding:10px 16px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
#fb{border-radius:10px;padding:14px 18px;display:none}
#fb.good{display:block;background:var(--good-bg);border:1px solid var(--good)}
#fb.bad{display:block;background:var(--bad-bg);border:1px solid var(--bad)}
#fb .de{font:500 1.25rem/1.35 var(--serif);margin:4px 0}
#fb .note{font-size:.88rem;color:var(--muted);margin:0}
#fb strong{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.good strong{color:var(--good)}.bad strong{color:var(--bad)}
.tip{font-size:.85rem;color:var(--muted);margin:0}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
footer{display:flex;flex-direction:column;gap:8px}
.opts{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.opts label{display:flex;flex-direction:column;gap:4px;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
select,input[type=number]{font:500 .95rem var(--sans);background:var(--tile);color:var(--fg);border:1px solid var(--tile-edge);border-radius:8px;padding:8px 10px}
input[type=number]{width:90px}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-weight:500;font-size:.85rem;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<header><h1>Satzbau</h1><div class="meta" id="pos"></div></header>
<section class="prompt"><p class="label">German sentence</p><p class="en" id="en"></p><div class="target" id="target"></div></section>
<section><p class="label">Your sentence (drag tiles here or tap them)</p><div id="answer" aria-live="polite"></div></section>
<section><p class="label">Word and phrase tiles</p><div id="tray"></div></section>
<div id="fb" role="status"></div>
<div class="row">
<button class="primary" id="check">Check</button>
<button id="next">Next sentence →</button>
<button id="undo">Undo</button>
<button id="hear">Hear German</button>
</div>
<footer>
<div class="bar"><i id="barfill"></i></div>
<div class="meta">Completed: <span id="done">0</span> of <span id="total">0</span> · Missed, coming back: <span id="missed">0</span></div>
<p class="tip">Tip: phrase tiles stay together, so you can focus on the shape and rhythm of the whole sentence. Missed sentences return at the end.</p>
<div class="opts">
<label for="mode">Each session starts
<select id="mode"><option value="resume">Where I left off</option><option value="random">At a random sentence</option><option value="shuffle">Fully shuffled</option></select></label>
<label for="jump">Jump to sentence #
<input type="number" id="jump" min="1" max="450" value="1"></label>
<button type="button" id="go">Go</button>
</div>
<div><button class="link" id="reset">Start over</button></div>
</footer>
</main>
<script>
const DATA=[{"rank": 1, "target": "die", "en": "The children are helping with the dishes today because Grandma is coming.", "tiles": ["Die Kinder", "helfen heute", "beim Abwasch,", "weil die Oma kommt."], "de": "Die Kinder helfen heute beim Abwasch, weil die Oma kommt.", "alts": [], "note": "weil: verb last; die Oma is nominative (feminine)"}, {"rank": 2, "target": "der", "en": "The train to Munich is ten minutes late.", "tiles": ["Der Zug", "nach München", "hat", "zehn Minuten Verspätung."], "de": "Der Zug nach München hat zehn Minuten Verspätung.", "alts": [], "note": "der Zug (masc.); die Verspätung (fem.)"}, {"rank": 3, "target": "und", "en": "I'm ordering a schnitzel, and my brother is having the soup.", "tiles": ["Ich bestelle", "ein Schnitzel,", "und mein Bruder", "nimmt die Suppe."], "de": "Ich bestelle ein Schnitzel, und mein Bruder nimmt die Suppe.", "alts": [], "note": "und + main clause: normal verb-second order"}, {"rank": 4, "target": "in", "en": "We stayed overnight in a small hotel by the station.", "tiles": ["Wir haben", "in einem kleinen Hotel", "am Bahnhof", "übernachtet."], "de": "Wir haben in einem kleinen Hotel am Bahnhof übernachtet.", "alts": ["Wir haben am Bahnhof in einem kleinen Hotel übernachtet."], "note": "in + Dativ for location: in einem kleinen Hotel"}, {"rank": 5, "target": "das", "en": "The package that arrived yesterday is still in the hallway.", "tiles": ["Das Paket,", "das gestern kam,", "steht noch", "im Flur."], "de": "Das Paket, das gestern kam, steht noch im Flur.", "alts": [], "note": "das Paket (neuter); relative pronoun das; verb last"}, {"rank": 6, "target": "den", "en": "The neighbor gives the children an apple every day.", "tiles": ["Die Nachbarin", "gibt", "den Kindern", "jeden Tag", "einen Apfel."], "de": "Die Nachbarin gibt den Kindern jeden Tag einen Apfel.", "alts": [], "note": "den Kindern: dative plural adds -n"}, {"rank": 7, "target": "mit", "en": "We are going to my aunt in Hamburg by train.", "tiles": ["Wir fahren", "mit dem Zug", "zu meiner Tante", "nach Hamburg."], "de": "Wir fahren mit dem Zug zu meiner Tante nach Hamburg.", "alts": [], "note": "mit + Dativ: mit dem Zug; zu + Dativ: zu meiner Tante"}, {"rank": 8, "target": "für", "en": "I reserved a table for four people for tonight.", "tiles": ["Ich habe", "für heute Abend", "einen Tisch", "für vier Personen", "reserviert."], "de": "Ich habe für heute Abend einen Tisch für vier Personen reserviert.", "alts": [], "note": "für + Akkusativ; die Person - die Personen"}, {"rank": 9, "target": "zu", "en": "It is too cold today to eat outside.", "tiles": ["Es ist heute", "zu kalt,", "um draußen", "zu essen."], "de": "Es ist heute zu kalt, um draußen zu essen.", "alts": [], "note": "um ... zu + Infinitiv: in order to"}, {"rank": 10, "target": "von", "en": "My grandma likes to tell about her childhood on the farm.", "tiles": ["Meine Oma", "erzählt gern", "von ihrer Kindheit", "auf dem Bauernhof."], "de": "Meine Oma erzählt gern von ihrer Kindheit auf dem Bauernhof.", "alts": [], "note": "von + Dativ: von ihrer Kindheit (fem.)"}, {"rank": 11, "target": "im", "en": "In summer we often sit in the garden in the evening.", "tiles": ["Im Sommer", "sitzen wir", "abends oft", "im Garten."], "de": "Im Sommer sitzen wir abends oft im Garten.", "alts": [], "note": "im = in dem: im Sommer, im Garten"}, {"rank": 12, "target": "ist", "en": "Do you know whether breakfast is included in the price?", "tiles": ["Wissen Sie,", "ob das Frühstück", "im Preis", "inbegriffen ist?"], "de": "Wissen Sie, ob das Frühstück im Preis inbegriffen ist?", "alts": [], "note": "ob-clause: conjugated verb goes last"}, {"rank": 13, "target": "auf", "en": "We have been waiting for the delayed train for an hour.", "tiles": ["Wir warten", "seit einer Stunde", "auf den verspäteten Zug."], "de": "Wir warten seit einer Stunde auf den verspäteten Zug.", "alts": [], "note": "warten auf + Akk; seit + Dativ: seit einer Stunde"}, {"rank": 14, "target": "sie", "en": "The neighbors are away, so we water their flowers while they are gone.", "tiles": ["Die Nachbarn", "sind verreist,", "deshalb gießen wir", "ihre Blumen,", "während sie", "weg sind."], "de": "Die Nachbarn sind verreist, deshalb gießen wir ihre Blumen, während sie weg sind.", "alts": [], "note": "deshalb triggers inversion: gießen wir; während: verb last"}, {"rank": 15, "target": "ein", "en": "I need a room with a shower for two nights.", "tiles": ["Ich brauche", "ein Zimmer", "mit Dusche", "für zwei Nächte."], "de": "Ich brauche ein Zimmer mit Dusche für zwei Nächte.", "alts": ["Ich brauche für zwei Nächte ein Zimmer mit Dusche."], "note": "die Nacht - die Nächte (umlaut plural)"}, {"rank": 16, "target": "sich", "en": "The guests were very happy about the tasty food.", "tiles": ["Die Gäste", "haben sich", "über das leckere Essen", "sehr gefreut."], "de": "Die Gäste haben sich über das leckere Essen sehr gefreut.", "alts": [], "note": "sich freuen über + Akk; der Gast - die Gäste"}, {"rank": 17, "target": "eine", "en": "Do you happen to have a receipt for me?", "tiles": ["Haben Sie", "vielleicht", "eine Quittung", "für mich?"], "de": "Haben Sie vielleicht eine Quittung für mich?", "alts": [], "note": "die Quittung: feminine, so eine (Akk.)"}, {"rank": 18, "target": "es", "en": "Because it has been raining for hours, we'd rather stay home.", "tiles": ["Weil es", "seit Stunden", "regnet,", "bleiben wir", "lieber zu Hause."], "de": "Weil es seit Stunden regnet, bleiben wir lieber zu Hause.", "alts": [], "note": "weil clause first, then verb-first main clause: bleiben wir"}, {"rank": 19, "target": "des", "en": "Because of the strike, the train is unfortunately cancelled today.", "tiles": ["Wegen des Streiks", "fällt der Zug", "heute leider", "aus."], "de": "Wegen des Streiks fällt der Zug heute leider aus.", "alts": [], "note": "wegen + Genitiv: des Streiks (masc. -s)"}, {"rank": 20, "target": "auch", "en": "I would like to try a piece of the cake too.", "tiles": ["Ich möchte", "auch", "ein Stück", "von dem Kuchen", "probieren."], "de": "Ich möchte auch ein Stück von dem Kuchen probieren.", "alts": [], "note": "von + Dativ: von dem Kuchen (= vom)"}, {"rank": 21, "target": "dem", "en": "Can you please bring the newspaper to Grandpa?", "tiles": ["Kannst du", "dem Opa", "bitte", "die Zeitung", "bringen?"], "de": "Kannst du dem Opa bitte die Zeitung bringen?", "alts": ["Kannst du bitte dem Opa die Zeitung bringen?"], "note": "bringen + Dativ person: dem Opa"}, {"rank": 22, "target": "nicht", "en": "I don't know whether the shop is still open today.", "tiles": ["Ich weiß nicht,", "ob der Laden", "heute noch", "geöffnet hat."], "de": "Ich weiß nicht, ob der Laden heute noch geöffnet hat.", "alts": [], "note": "ob-clause: verb last; der Laden (masc.)"}, {"rank": 23, "target": "werden", "en": "Tomorrow we will visit the cathedral if it doesn't rain.", "tiles": ["Morgen werden wir", "den Dom", "besichtigen,", "wenn es", "nicht regnet."], "de": "Morgen werden wir den Dom besichtigen, wenn es nicht regnet.", "alts": [], "note": "Future: werden + Infinitiv at the end; der Dom (Akk.: den)"}, {"rank": 24, "target": "an", "en": "Grandma hangs the wet laundry on the line.", "tiles": ["Die Oma", "hängt", "die nasse Wäsche", "an die Leine."], "de": "Die Oma hängt die nasse Wäsche an die Leine.", "alts": [], "note": "an + Akk (movement): an die Leine; die Wäsche"}, {"rank": 25, "target": "bei", "en": "During the holidays the children live with their grandparents.", "tiles": ["Während der Ferien", "wohnen die Kinder", "bei ihren Großeltern."], "de": "Während der Ferien wohnen die Kinder bei ihren Großeltern.", "alts": [], "note": "während + Genitiv; bei + Dativ plural: ihren Großeltern"}, {"rank": 26, "target": "als", "en": "When we arrived, the restaurant was already full.", "tiles": ["Als wir ankamen,", "war", "das Restaurant", "schon voll."], "de": "Als wir ankamen, war das Restaurant schon voll.", "alts": [], "note": "als = once in the past; verb last, then verb-first main clause"}, {"rank": 27, "target": "sind", "en": "Yesterday's rolls have unfortunately already gone hard.", "tiles": ["Die Brötchen", "von gestern", "sind leider", "schon hart geworden."], "de": "Die Brötchen von gestern sind leider schon hart geworden.", "alts": [], "note": "das Brötchen - die Brötchen; hart werden: perfect uses sein"}, {"rank": 28, "target": "am", "en": "On Monday we have to pick up the package at the counter.", "tiles": ["Am Montag", "müssen wir", "das Paket", "am Schalter", "abholen."], "de": "Am Montag müssen wir das Paket am Schalter abholen.", "alts": [], "note": "am = an dem: am Montag, am Schalter (masc.)"}, {"rank": 29, "target": "aus", "en": "My great-grandmother came from a small village in Bavaria.", "tiles": ["Meine Urgroßmutter", "kam", "aus einem kleinen Dorf", "in Bayern."], "de": "Meine Urgroßmutter kam aus einem kleinen Dorf in Bayern.", "alts": [], "note": "aus + Dativ: aus einem kleinen Dorf (neuter)"}, {"rank": 30, "target": "oder", "en": "Would you rather sit by the window or on the aisle?", "tiles": ["Möchten Sie", "lieber", "am Fenster", "oder am Gang", "sitzen?"], "de": "Möchten Sie lieber am Fenster oder am Gang sitzen?", "alts": [], "note": "am Fenster, am Gang: an + Dativ"}, {"rank": 31, "target": "nach", "en": "After dinner we do the dishes together.", "tiles": ["Nach dem Abendessen", "spülen wir", "das Geschirr", "gemeinsam."], "de": "Nach dem Abendessen spülen wir das Geschirr gemeinsam.", "alts": [], "note": "nach + Dativ: nach dem Abendessen (neuter)"}, {"rank": 32, "target": "wie", "en": "Do you remember how long we had to wait for the bus back then?", "tiles": ["Weißt du noch,", "wie lange", "wir damals", "auf den Bus", "warten mussten?"], "de": "Weißt du noch, wie lange wir damals auf den Bus warten mussten?", "alts": [], "note": "Subordinate clause with modal: warten mussten (verb last)"}, {"rank": 33, "target": "wird", "en": "Breakfast is served every morning from seven.", "tiles": ["Das Frühstück", "wird", "jeden Morgen", "ab sieben", "serviert."], "de": "Das Frühstück wird jeden Morgen ab sieben serviert.", "alts": [], "note": "Passive: wird + Partizip II at the end"}, {"rank": 34, "target": "dass", "en": "My aunt hopes that we will visit her again soon.", "tiles": ["Meine Tante hofft,", "dass wir", "sie", "bald wieder", "besuchen."], "de": "Meine Tante hofft, dass wir sie bald wieder besuchen.", "alts": [], "note": "dass-clause: verb last"}, {"rank": 35, "target": "wir", "en": "If we want to arrive on time, we have to leave now.", "tiles": ["Wenn wir", "pünktlich ankommen wollen,", "müssen wir", "jetzt losgehen."], "de": "Wenn wir pünktlich ankommen wollen, müssen wir jetzt losgehen.", "alts": [], "note": "wenn-clause first, then inversion: müssen wir"}, {"rank": 36, "target": "um", "en": "At half past seven the taxi driver picks us up from the hotel.", "tiles": ["Um halb acht", "holt", "der Taxifahrer", "uns", "vom Hotel ab."], "de": "Um halb acht holt der Taxifahrer uns vom Hotel ab.", "alts": [], "note": "Separable verb: abholen - holt ... ab; halb acht = 7:30"}, {"rank": 37, "target": "hat", "en": "My sister gave the mail carrier a tip.", "tiles": ["Meine Schwester", "hat", "dem Postboten", "ein Trinkgeld", "gegeben."], "de": "Meine Schwester hat dem Postboten ein Trinkgeld gegeben.", "alts": [], "note": "dem Postboten: n-declension noun in dative"}, {"rank": 38, "target": "einer", "en": "I talked with a nice saleswoman about the price.", "tiles": ["Ich habe", "mit einer netten Verkäuferin", "über den Preis", "gesprochen."], "de": "Ich habe mit einer netten Verkäuferin über den Preis gesprochen.", "alts": [], "note": "mit + Dativ fem.: einer netten Verkäuferin"}, {"rank": 39, "target": "einen", "en": "We urgently need a new trash can for the kitchen.", "tiles": ["Wir brauchen", "dringend", "einen neuen Mülleimer", "für die Küche."], "de": "Wir brauchen dringend einen neuen Mülleimer für die Küche.", "alts": [], "note": "der Mülleimer, Akk.: einen   if(!st.queue.length){showFinished();return}
  cur=DATA[st.queue[0]];checked=false;missedNow=false;ans=[];
  let t=cur.tiles.map((x,i)=>({id:i,text:x}));
  let s;do{s=shuffle(t)}while(t.length>1&&s.every((x,i)=>x.id===i));
  tiles=s;
  $('en').textContent=cur.en;
  $('target').innerHTML='Target word: <b>'+esc(cur.target)+'</b> (#'+cur.rank+')';
  $('fb').className='';$('fb').innerHTML='';
  $('check').disabled=false;
  render();
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function mk(t,inAns){
  const b=document.createElement('button');b.type='button';b.className='tile';b.textContent=t.text;b.draggable=true;b.dataset.id=t.id;
  b.addEventListener('click',()=>{if(checked)return;if(inAns){ans=ans.filter(x=>x.id!==t.id)}else{ans.push(t)}render()});
  b.addEventListener('dragstart',e=>{dragId=t.id;b.classList.add('drag');e.dataTransfer.setData('text/plain',String(t.id));e.dataTransfer.effectAllowed='move'});
  b.addEventListener('dragend',()=>{dragId=null;b.classList.remove('drag')});
  if(inAns){b.addEventListener('dragover',e=>e.preventDefault());b.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();dropAt(t.id)})}
  return b;
}
function dropAt(beforeId){
  if(dragId===null||checked)return;
  const t=tiles.find(x=>x.id===dragId);if(!t)return;
  ans=ans.filter(x=>x.id!==dragId);
  if(beforeId==null){ans.push(t)}else{const i=ans.findIndex(x=>x.id===beforeId);ans.splice(i<0?ans.length:i,0,t)}
  dragId=null;render();
}
function render(){
  const A=$('answer'),T=$('tray');A.innerHTML='';T.innerHTML='';
  if(!ans.length){const p=document.createElement('span');p.className='ph';p.textContent='Build the sentence here';A.appendChild(p)}
  ans.forEach(t=>A.appendChild(mk(t,true)));
  const used=new Set(ans.map(x=>x.id));
  tiles.forEach(t=>{if(!used.has(t.id))T.appendChild(mk(t,false))});
  const d=st.done.length;$('done').textContent=d;$('total').textContent=DATA.length;$('missed').textContent=st.retry.length;
  $('barfill').style.width=(100*d/DATA.length)+'%';
  $('pos').textContent=st.queue.length?'Sentence '+(d+1)+' of '+DATA.length:'';
  $('undo').disabled=checked||!ans.length;
}
const A=$('answer');
A.addEventListener('dragover',e=>{e.preventDefault();A.classList.add('over')});
A.addEventListener('dragleave',()=>A.classList.remove('over'));
A.addEventListener('drop',e=>{e.preventDefault();A.classList.remove('over');dropAt(null)});
const T=$('tray');
T.addEventListener('dragover',e=>e.preventDefault());
T.addEventListener('drop',e=>{e.preventDefault();if(dragId!==null){ans=ans.filter(x=>x.id!==dragId);dragId=null;render()}});
function norm(s){return s.replace(/\s+/g,' ').trim()}
$('check').onclick=()=>{
  if(checked)return;
  if(ans.length<tiles.length){fb('bad','Not yet','Place all '+tiles.length+' tiles first.');return}
  const got=norm(ans.map(x=>x.text).join(' '));
  const ok=[cur.de,...(cur.alts||[])].some(s=>norm(s)===got);
  checked=true;$('check').disabled=true;
  if(ok){
    const idx=st.queue[0];st.done.push(idx);st.queue.shift();st.retry=st.retry.filter(i=>i!==idx);
    fb('good','Richtig',cur.de,cur.note);save();
  }else{
    missedNow=true;
    const idx=st.queue[0];st.queue.shift();st.queue.push(idx);if(!st.retry.includes(idx))st.retry.push(idx);
    fb('bad','Not quite — correct order',cur.de,cur.note);save();
  }
  render();$('undo').disabled=true;
};
function fb(kind,head,de,note){
  const f=$('fb');f.className=kind;
  f.innerHTML='<strong>'+esc(head)+'</strong>'+(kind==='bad'&&de.length<4?'<p class="note">'+esc(de)+'</p>':'<p class="de">'+esc(de)+'</p>'+(note?'<p class="note">'+esc(note)+'</p>':''));
}
$('next').onclick=()=>{
  if(!checked&&cur){ /* skipping counts as a miss */
    const idx=st.queue[0];st.queue.shift();st.queue.push(idx);if(!st.retry.includes(idx))st.retry.push(idx);save();
  }
  load();
};
$('undo').onclick=()=>{if(!checked&&ans.length){ans.pop();render()}};
$('hear').onclick=()=>{
  try{
    if(!cur||!('speechSynthesis' in window))return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(cur.de);u.lang='de-DE';u.rate=.9;
    const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith('de'));if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
};
$('reset').onclick=()=>{st={queue:DATA.map((_,i)=>i),done:[],retry:[]};save();load()};
function showFinished(){
  cur=null;$('en').textContent='All 450 sentences completed.';$('target').textContent='';
  A.innerHTML='';$('tray').innerHTML='';$('check').disabled=true;$('undo').disabled=true;
  $('fb').className='good';$('fb').innerHTML='<strong>Fertig</strong><p class="note">Use Start over to run through them again.</p>';render();
}
const MK='satzbau-mode';
let mode='resume';
try{mode=localStorage.getItem(MK)||'resume'}catch(e){}
$('mode').value=mode;
$('mode').onchange=()=>{mode=$('mode').value;try{localStorage.setItem(MK,mode)}catch(e){}};
$('jump').max=DATA.length;
$('go').onclick=()=>{
  const n=Math.round(+$('jump').value);if(!(n>=1&&n<=DATA.length))return;
  const idx=n-1;st.done=st.done.filter(i=>i!==idx);
  let q=st.queue.filter(i=>i!==idx);
  let pos=q.findIndex(i=>i>idx);if(pos<0)pos=0;
  q=q.slice(pos).concat(q.slice(0,pos));
  st.queue=[idx,...q];save();load();
};
if(st.queue.length>1){
  if(mode==='random'){const k=Math.floor(Math.random()*st.queue.length);st.queue=st.queue.slice(k).concat(st.queue.slice(0,k));save()}
  else if(mode==='shuffle'){st.queue=shuffle(st.queue);save()}
}
load();
</script>
