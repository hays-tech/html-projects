  btn._busy = true;
  btn.animate([{transform:'perspective(500px) rotateY(0deg)'},{transform:'perspective(500px) rotateY(90deg)'}],{duration:120,easing:'ease-in',fill:'forwards'}).finished
    .then(() => { paint(btn); return btn.animate([{transform:'perspective(500px) rotateY(-90deg)'},{transform:'perspective(500px) rotateY(0deg)'}],{duration:120,easing:'ease-out'}).finished; })
    .catch(() => {})
    .then(() => { btn.getAnimations().forEach(a => a.cancel()); paint(btn); btn._busy = false; });
});
document.getElementById('shuffle').addEventListener('click', () => {
  for (let k = order.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [order[k], order[j]] = [order[j], order[k]]; }
  state.fill(0); build(); window.scrollTo(0, 0);
});
document.getElementById('reset').addEventListener('click', () => {
  order = DATA.map((_, i) => i); state.fill(0); build(); window.scrollTo(0, 0);
});
document.getElementById('count').textContent = DATA.length + ' characters. Tap: meaning, tap: pinyin, tap: back.';
build();
</script>
