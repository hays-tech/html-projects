<style>
/* Layout: single centered column, a practice panel above a stats panel. */
:root {

  --placeholder: #94a3b8;
  --stat-bg: #f3f6fa;
  --good-bg: #e9f8ef;
  --bad-bg: #fff0ef;
  --focus: #93b4ff;
  --on-blue: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e4eaf5;
    --muted: #9aa8bf;
    --line: #2c3850;
    --blue: #5b84e6;
    --pale: #1f2c4d;
    --green: #5fd196;
    --red: #ff8f84;
    --bg: #0f1522;
    --panel: #172033;
    --answer-bg: #121a2b;
    --answer-line: #3a4863;
    --answer-tile-line: #3f5aa3;
    --tile-shadow: #0c1220;
    --placeholder: #6d7b93;
    --stat-bg: #1c263b;
    --good-bg: #12301f;
    --bad-bg: #3a1a18;
    --focus: #6f94f0;
    --on-blue: #0f1522;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #e4eaf5;
  --muted: #9aa8bf;
  --line: #2c3850;
  --blue: #5b84e6;
  --pale: #1f2c4d;
  --green: #5fd196;
  --red: #ff8f84;
  --bg: #0f1522;
  --panel: #172033;
  --answer-bg: #121a2b;
  --answer-line: #3a4863;
  --answer-tile-line: #3f5aa3;
  --tile-shadow: #0c1220;
  --placeholder: #6d7b93;
  --stat-bg: #1c263b;

  --focus: #6f94f0;

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 system-ui, sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px;
}
.app { max-width: 760px; margin: auto; }
header, .row {
  display: flex; justify-content: space-between;
  align-items: center; gap: 10px; flex-wrap: wrap;
}
h1 { font-size: 1.35rem; margin: 0; }
.muted { color: var(--muted); font-size: .9rem; }
.panel {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 17px; padding: 15px; margin-top: 12px;
}
.pill {
  border: 1px solid var(--line); border-radius: 99px;
  padding: 6px 10px; font-size: .85rem;
}
.label {
  color: var(--muted); font-size: .77rem;
  text-transform: uppercase; letter-spacing: .08em;
  font-weight: 750;
}
.prompt { font-size: 1.25rem; font-weight: 750; margin-top: 8px; }
.pinyin { color: var(--muted); margin-top: 5px; min-height: 1.5em; }
.answer {
  min-height: 76px; display: flex; align-items: center;
  flex-wrap: wrap; gap: 8px; padding: 11px;
  margin-top: 14px; border: 2px dashed var(--answer-line);
  border-radius: 13px; background: var(--answer-bg);
}
.placeholder { color: var(--placeholder); }
.bank, .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
button {
  cursor: pointer; font: inherit; color: var(--ink);
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 11px; padding: 9px 12px;
}
button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); }
button:disabled { opacity: .4; cursor: default; }
.tile {
  font-size: 25px; line-height: 1.3; padding: 7px 11px;
  border-color: var(--answer-line); box-shadow: 0 1px 0 var(--tile-shadow);
}
.answer .tile {
  font-size: 28px; background: var(--pale);
  border-color: var(--answer-tile-line);
}
.primary { background: var(--blue); color: var(--on-blue); border-color: var(--blue); }
.danger { color: var(--red); border-color: var(--red); }
.feedback { margin-top: 12px; padding: 11px; border-radius: 11px; }
.good { color: var(--green); background: var(--good-bg); }
.bad { color: var(--red); background: var(--bad-bg); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--stat-bg); padding: 10px 5px; text-align: center; border-radius: 11px; min-width: 0; }
.stat strong { display: block; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: .75rem; color: var(--muted); }
@media (max-width: 500px) {
  .panel { padding: 12px; }
  h1 { font-size: 1.15rem; }
  .stats { gap: 5px; }
  .stat { padding: 5px 2px; border-radius: 9px; }
  .stat strong { font-size: 1rem; line-height: 1.2; }
  .stat span { font-size: .6rem; line-height: 1.15; display: block; }
  .stats-panel { padding: 8px; margin-top: 8px; }
  .stats-panel .controls { gap: 5px; margin-top: 7px; flex-wrap: nowrap; }
  .stats-panel .controls button { flex: 1 1 0; min-width: 0; padding: 7px 4px; font-size: .72rem; border-radius: 9px; white-space: normal; line-height: 1.15; }
  .stats-panel .muted { font-size: .7rem; margin: 6px 0 0; }
}
</style>

<main class="app">
  <header>
    <div>
      <h1>HSK Sentence Studio</h1>
      <div class="muted">Build Chinese sentences one tile at a time.</div>
    </div>
    <span class="pill" id="progress">Sentence 1 / 450</span>
  </header>

  <section class="panel">
    <div class="row">
      <span class="label">Translate into Chinese</span>
      <label class="pill" for="pinyinToggle"><input id="pinyinToggle" type="checkbox" checked> Show pinyin</label>
    </div>
    <div class="prompt" id="english"></div>
    <div class="pinyin" id="pinyin"></div>
    <div class="answer" id="answer" aria-label="Your answer"></div>
    <div class="bank" id="bank" aria-label="Word tiles"></div>
    <div class="controls">
      <button class="primary" id="check">Check answer</button>
      <button id="undo">Undo</button>
      <button id="clear">Clear</button>
      <button id="hint">Hint</button>
      <button id="speak" aria-label="Hear the whole sentence" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg> Listen
      </button>
    </div>
    <div id="feedback" aria-live="polite"></div>
  </section>

  <section class="panel stats-panel">
    <div class="stats">
      <div class="stat"><strong id="solved">0</strong><span>Solved</span></div>
      <div class="stat"><strong id="accuracy">—</strong><span>First-try</span></div>
      <div class="stat"><strong id="attempts">0</strong><span>Attempts</span></div>
      <div class="stat"><strong id="missed">0</strong><span>Need review</span></div>
    </div>
    <div class="controls">
      <button class="primary" id="next">Next →</button>
      <button id="review">Review missed</button>
      <button id="all">All</button>
      <button id="reset">Reset</button>
    </div>
    <p class="muted" id="mode">Practice mode · All sentences</p>
  </section>
</main>

let order = shuffle([...Array(data.length).keys()]);
let pos = 0;
let index = order[0];
let chosen = [];
let solved = new Set();
let missed = new Set();
let attempts = 0;
let firstTry = 0;
let reviewMode = false;
let reviewList = [];
let reviewPos = 0;
let hadWrongTry = new Set();

const el = id => document.getElementById(id);
const current = () => data[index];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function render() {
  chosen = [];
  const s = current();
  el("progress").textContent = reviewMode ? `Review ${reviewPos + 1} / ${reviewList.length}` : `Sentence ${pos + 1} / ${data.length}`;
  el("english").textContent = s[0];
  el("pinyin").textContent = el("pinyinToggle").checked ? s[2] : "";
  el("feedback").replaceChildren();
  renderAnswer();
  renderBank();
  updateStats();
  el("check").disabled = solved.has(index);
  el("clear").disabled = solved.has(index);
}

function renderAnswer() {
  const area = el("answer");
  area.replaceChildren();

  if (!chosen.length) {
    const hint = document.createElement("span");
    hint.className = "placeholder";
    hint.textContent = "Tap word tiles below to build your answer…";
    area.append(hint);
    return;
  }

  chosen.forEach((word, position) => {
    const button = document.createElement("button");
    button.className = "tile";
    button.textContent = word;
    button.title = "Tap to remove";
    button.onclick = () => {
      if (solved.has(index)) return;
      chosen.splice(position, 1);
      renderAnswer();
      renderBank();
    };
    area.append(button);
  });
}

function renderBank() {
  const area = el("bank");
  area.replaceChildren();

  // Each tile has its own identity, so duplicate words work correctly.
  const available = shuffle(current()[3].map((word, id) => ({word, id})));
  const used = new Set();
  chosen.forEach(word => {
    const match = current()[3].findIndex((w, i) => w === word && !used.has(i));
    if (match !== -1) used.add(match);
  });

  available.forEach(item => {
    const button = document.createElement("button");
    button.className = "tile";
    button.textContent = item.word;
    button.disabled = solved.has(index) || used.has(item.id);
    button.onclick = () => {
      if (solved.has(index)) return;
      chosen.push(item.word);
      renderAnswer();
      renderBank();
    };
    area.append(button);
  });
}

function feedback(message, kind) {
  const box = document.createElement("div");
  box.className = "feedback " + kind;
  box.textContent = message;
  el("feedback").replaceChildren(box);
}

function checkAnswer() {
  if (solved.has(index)) return;
  if (!chosen.length) {
    feedback("Choose some word tiles first.", "bad");
    return;
  }

  attempts++;
  const correct = chosen.join("") === current()[3].join("");

  if (correct) {
    if (!hadWrongTry.has(index)) firstTry++;
    solved.add(index);
    missed.delete(index);
    feedback("Correct! " + current()[1] + "  " + current()[2], "good");
    el("check").disabled = true;
    el("clear").disabled = true;
  } else {
    missed.add(index);
    hadWrongTry.add(index);
    feedback("Not quite. Try changing the word order.", "bad");
  }
  updateStats();
}

function updateStats() {
  el("solved").textContent = solved.size;
  el("accuracy").textContent = attempts ? Math.round(firstTry / attempts * 100) + "%" : "—";
  el("attempts").textContent = attempts;
  el("missed").textContent = missed.size;
  el("review").textContent = `Review missed (${missed.size})`;
}

function nextSentence() {
  if (reviewMode) {
    if (!reviewList.length) {
      feedback("No missed sentences to review. Keep practicing!", "good");
      return;
    }
    reviewPos = (reviewPos + 1) % reviewList.length;
    index = reviewList[reviewPos];
  } else {
    pos = (pos + 1) % data.length;
    if (pos === 0) order = shuffle(order);
    index = order[pos];
  }
  render();
}

el("check").onclick = checkAnswer;
el("undo").onclick = () => {
  if (!solved.has(index) && chosen.length) {
    chosen.pop();
    renderAnswer();
    renderBank();
  }
};
el("clear").onclick = () => {
  if (!solved.has(index)) {
    chosen = [];
    renderAnswer();
    renderBank();
    el("feedback").replaceChildren();
  }
};
el("hint").onclick = () => {
  if (solved.has(index)) return;
  const nextWord = current()[3][chosen.length];
  feedback(nextWord ? "Next word: " + nextWord : "All words are placed. Check your answer.", "good");
};
if ("speechSynthesis" in window) el("speak").hidden = false;
el("speak").onclick = () => {
  try {
    const u = new SpeechSynthesisUtterance(current()[1]);
    u.lang = "zh-CN";
    u.rate = 0.8;
    const v = speechSynthesis.getVoices().find(v => /^zh/i.test(v.lang));
    if (v) u.voice = v;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } catch (e) {
    feedback("Sound isn't available in this browser.", "bad");
  }
};
el("next").onclick = nextSentence;
el("pinyinToggle").onchange = () => {
  el("pinyin").textContent = el("pinyinToggle").checked ? current()[2] : "";
};
el("review").onclick = () => {
  if (!missed.size) {
    feedback("No missed sentences yet — keep practicing!", "good");
    return;
  }
  reviewMode = true;
  reviewList = [...missed];
  reviewPos = 0;
  index = reviewList[0];
  el("mode").textContent = "Practice mode · Review missed";
  render();
};
el("all").onclick = () => {
  reviewMode = false;
  reviewList = [];
  order = shuffle(order);
  pos = 0;
  index = order[0];
  el("mode").textContent = "Practice mode · All sentences";
  render();
};

// confirm() is blocked in the viewer, so Reset asks for a second tap instead.
let resetTimer = null;
function disarmReset() {
  clearTimeout(resetTimer);
  resetTimer = null;
  el("reset").textContent = "Reset score";
  el("reset").classList.remove("danger");
}
el("reset").onclick = () => {
  if (!resetTimer) {
    el("reset").textContent = "Tap again to confirm";
    el("reset").classList.add("danger");
    resetTimer = setTimeout(disarmReset, 4000);
    return;
  }
  disarmReset();
  order = shuffle(order);
  pos = 0;
  index = order[0];
  chosen = [];
  solved.clear();
  missed.clear();
  hadWrongTry.clear();
  attempts = 0;
  firstTry = 0;
  reviewMode = false;
  reviewList = [];
  el("mode").textContent = "Practice mode · All sentences";
  render();
};

render();
</script>
